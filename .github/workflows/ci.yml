name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xs_abogados_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xs_abogados_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xs_abogados_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/xs_abogados_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xs_abogados_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      EMAIL_PROVIDER: mock
      CALENDAR_PROVIDER: mock
      NEXT_PUBLIC_CALENDAR_PROVIDER: mock
      STORAGE_PROVIDER: local
      PRIVATE_UPLOAD_DIR: .data/ci-uploads
      FILE_SCANNER_PROVIDER: mock
      RATE_LIMIT_PROVIDER: database
      RATE_LIMIT_SALT: ci-rate-limit-salt-not-for-production
      DATA_ENCRYPTION_KEY_VERSION: v1
      DATA_ENCRYPTION_KEY_CURRENT: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MFA_RECOVERY_CODE_PEPPER: ci-only-mfa-recovery-code-pepper
      ENABLE_DEMO_AUTH: "false"
      ALLOW_DATABASE_SEED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:secrets
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:validate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
